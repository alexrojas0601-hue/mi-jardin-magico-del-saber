<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Jardín Mágico del Saber</title>
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="El Jardín Mágico del Saber: libro interactivo de cuentos de CENTEC para Transición a 3.°. Leer, pensar, sentir, crear y crecer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: una banda azul SABI arriba (identidad + árbol de semillas), estante de cuentos en cuadrícula,
   y una vista de lectura de una columna (~65 caracteres) con pestañas Leer · Jugar · Pensar · Reinventar · Videoclip. */
:root{
  --navy:#1A2D7A; --orange:#F47C20; --gold:#F5C518;
  --bg:#F5F6FB; --surface:#FFFFFF; --surface-2:#ECEFFA; --ink:#141D45; --muted:#545E8C;
  --line:#D6DBF0; --accent-ink:#B9520A; --ok:#1E7F4F; --ok-bg:#E3F4EA; --err-bg:#FFF1E6;
  --band:#1A2D7A; --band-ink:#FFFFFF; --band-muted:#C9D1F5;
  --leaf:#3E9B5F; --trunk:#8A5A2B; --ground:#C9D9B8;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --read:1.15rem; --paper:#FFFDF7; --navy-ink:#1A2D7A;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1330; --surface:#141D45; --surface-2:#1C2758; --ink:#EEF1FF; --muted:#A9B2DC;
  --line:#2C3870; --accent-ink:#FFA35C; --ok:#6FD39A; --ok-bg:#123A2A; --err-bg:#3A2412;
  --band:#101A47; --band-ink:#FFFFFF; --band-muted:#A9B2DC; --leaf:#5CC17F; --trunk:#B88049; --ground:#2E4A33; --paper:#141D45; --navy-ink:#C9D1F5;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1330; --surface:#141D45; --surface-2:#1C2758; --ink:#EEF1FF; --muted:#A9B2DC;
  --line:#2C3870; --accent-ink:#FFA35C; --ok:#6FD39A; --ok-bg:#123A2A; --err-bg:#3A2412;
  --band:#101A47; --band-ink:#FFFFFF; --band-muted:#A9B2DC; --leaf:#5CC17F; --trunk:#B88049; --ground:#2E4A33; --paper:#141D45; --navy-ink:#C9D1F5;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
a{color:var(--accent-ink)}

/* Banda superior */
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;justify-content:space-between;padding-block:22px 20px}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand h1{font-size:clamp(1.6rem,4.6vw,2.4rem);font-weight:800;letter-spacing:.2px}
.brand h1 span{color:var(--gold)}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--band-muted);font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--band-ink);padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1A2D7A}
.band select{background:rgba(255,255,255,.1);color:var(--band-ink);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font-weight:700}
.band select option{color:#141D45}
.tree-chip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:16px;padding:6px 14px 6px 6px;border:0;color:var(--band-ink);cursor:pointer;text-align:left}
.tree-chip svg{width:52px;height:52px;flex:none}
.tree-chip b{font-family:var(--display);font-size:1.25rem;color:var(--gold);display:block;line-height:1}
.tree-chip small{color:var(--band-muted);font-size:.78rem}

main{padding-block:28px 64px}
.lead{max-width:65ch;color:var(--muted);font-size:1.05rem;margin:8px 0 0}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:36px 0 14px}
.section-title h2{font-size:1.6rem}
.chip{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.rev{background:var(--err-bg);color:var(--accent-ink)}

/* Estante */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.book{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;min-width:0;transition:transform .15s ease,border-color .15s ease}
.book:hover{transform:translateY(-2px);border-color:var(--orange)}
.book .num{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;color:var(--orange)}
.book h3{font-size:1.25rem}
.book p{margin:0;color:var(--muted);font-size:.95rem}
.book .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;font-size:.8rem;color:var(--muted)}
.dot{display:inline-flex;gap:4px;align-items:center}
.dot i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.dot i.on{background:var(--gold)}

/* Intro capítulo */
.chapter{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.chapter{grid-template-columns:1fr}}
.chapter .intro p{margin:0 0 10px;max-width:65ch}
.dice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.dice h3{font-size:1.2rem;margin-bottom:6px}
.dice-out{font-size:1.05rem;margin:10px 0 12px;min-height:3.2em}
.dice-out b{color:var(--accent-ink)}

.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--gold);color:#1A2D7A;text-decoration:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.navy{background:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.navy{background:#3A4FB0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.navy{background:#3A4FB0}}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:.88rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Vista de cuento */
.back{background:none;border:0;color:var(--accent-ink);font-weight:700;cursor:pointer;padding:4px 0}
.story-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin:10px 0 18px}
.story-head h2{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800}
.story-head .num{font-family:var(--display);color:var(--orange);font-weight:800}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:22px;scrollbar-width:thin}
.tabs button{flex:none;border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--orange)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.reading{max-width:65ch}
.reading p{font-size:var(--read);line-height:1.75;margin:0 0 1em}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.words{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 0}
.word{background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:.95rem}
.word b{font-family:var(--display);color:var(--accent-ink);font-size:1.05rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:1.15rem;margin-bottom:8px}
.card ul{margin:0;padding-left:1.2em}
.card li{margin:4px 0}
.side{display:flex;flex-direction:column;gap:16px}
.side .card p{margin:0 0 8px}
.ruta h4{font-family:var(--display);font-size:1rem;margin:10px 0 4px;color:var(--accent-ink)}
.ruta h4:first-child{margin-top:0}

/* Jugar */
.quiz{max-width:65ch}
.qprog{display:flex;gap:6px;margin-bottom:14px}
.qprog i{flex:1;height:8px;border-radius:999px;background:var(--line)}
.qprog i.done{background:var(--gold)}
.qprog i.now{background:var(--orange)}
.qlevel{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent-ink)}
.qtext{font-family:var(--display);font-size:1.5rem;font-weight:600;margin:6px 0 16px;line-height:1.25}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;cursor:pointer;font-size:1.05rem}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--orange);background:var(--err-bg)}
.fb{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--surface-2)}
.fb.ok{background:var(--ok-bg)}
.fb.err{background:var(--err-bg)}
.fb q{display:block;font-style:italic;margin-top:6px;quotes:"«" "»"}
.done-box{text-align:center;padding:28px 18px}
.done-box b{font-family:var(--display);font-size:2.2rem;color:var(--accent-ink);display:block}

/* Pensar / Reinventar */
.open{display:grid;gap:18px;max-width:70ch}
.open .card .q{font-size:1.1rem;font-weight:700;margin:4px 0 6px}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 10px}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);resize:vertical;font-size:1.02rem;line-height:1.5}
.ai{margin-top:12px;padding:12px 14px;border-left:4px solid var(--gold);background:var(--surface-2);border-radius:0 12px 12px 0;white-space:pre-wrap}
.ai-label{font-family:var(--display);font-weight:800;color:var(--accent-ink);display:block;margin-bottom:2px}
.prompts{display:grid;gap:8px;margin:8px 0 14px}
.prompt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer}
.prompt[aria-pressed="true"]{border-color:var(--orange);background:var(--err-bg)}
.versions{display:grid;gap:12px;margin-top:8px}
.version{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.version small{color:var(--muted)}
.version p{white-space:pre-wrap;margin:6px 0 10px}
.wa{font-size:.9rem;color:var(--muted)}
.wa code{font-family:var(--body);font-weight:700;color:var(--ink);user-select:all}

/* Video */
.video-box{max-width:720px}
.video-box video{width:100%;max-width:100%;border-radius:var(--r);background:#000}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}

/* Mural */
.mural{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.mural article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.mural article h3{font-size:1.15rem}
.mural article p{white-space:pre-wrap;margin:8px 0}
.mural article small{color:var(--muted)}

/* Árbol */
.tree-panel{display:grid;grid-template-columns:160px minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:520px){.tree-panel{grid-template-columns:1fr;justify-items:center;text-align:center}}
.tree-panel svg{width:160px;height:160px}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stages span{font-size:.8rem;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.stages span.on{background:var(--gold);color:#1A2D7A;font-weight:700}
.t-ground{fill:var(--ground)} .t-trunk{fill:var(--trunk)} .t-leaf{fill:var(--leaf)} .t-flower{fill:var(--orange)} .t-star{fill:var(--gold)} .t-seed{fill:var(--trunk)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20;max-width:calc(100% - 32px)}
/* Crecer y competencias */
.compass-banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:28px;padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--gold);color:var(--ink);text-decoration:none}
.compass-banner:hover{border-color:var(--orange)}
.compass-banner>span:nth-child(2){flex:1 1 260px;color:var(--muted)}
.compass-banner b{display:block;font-family:var(--display);font-size:1.25rem;color:var(--ink)}
.compass-ico{font-size:2rem;line-height:1}
.grow{display:grid;gap:16px;max-width:70ch}
.grow .card h3{margin:4px 0 6px}
.grow .card p{margin:0 0 10px}
.g-emo{border-left:5px solid var(--orange)}.g-val{border-left:5px solid var(--gold)}.g-dis{border-left:5px solid var(--navy)}
:root[data-theme="dark"] .g-dis{border-left-color:#6E82E0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .g-dis{border-left-color:#6E82E0}}
.g-inn{border-left:5px solid var(--leaf)}.g-con{border-left:5px solid var(--muted)}
.seeds{margin:0;padding-left:1.1em;font-size:.93rem}.seeds li{margin:5px 0}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.comp h3{font-size:1.12rem;margin-bottom:6px}
.seed{margin:0;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.seed span{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent-ink);margin-bottom:2px}
.chip.link{text-decoration:none;text-transform:none;letter-spacing:0;font-size:.78rem}
.chip.link:hover{color:var(--accent-ink)}

.compass-banner.invest{margin-top:12px;border-color:var(--navy)}
:root[data-theme="dark"] .compass-banner.invest{border-color:#6E82E0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .compass-banner.invest{border-color:#6E82E0}}
.ref{font-size:.8rem;font-weight:700;text-decoration:none;margin-left:2px}
.plan{margin:0;padding-left:1.3em}.plan li{margin:8px 0}
.fuentes{font-size:.88rem;color:var(--muted);padding-left:1.3em;max-width:90ch}.fuentes li{margin:6px 0;overflow-wrap:anywhere}

/* Navegación y libro página por página */
.topnav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topnav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.topnav a{flex:none;padding:12px 14px;font-weight:700;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent}
.topnav a[aria-current="page"]{color:var(--ink);border-color:var(--orange)}
.book-banner{border-color:var(--orange)}
.sheet{position:relative;max-width:760px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:6px 18px 18px 6px;box-shadow:0 1px 0 var(--line),0 12px 32px -18px rgba(26,45,122,.45);padding:clamp(22px,5vw,56px) clamp(18px,6vw,64px) 56px;animation:hoja .28s ease}
@keyframes hoja{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.kicker{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent-ink);text-align:center}
.page-title{font-size:clamp(1.8rem,5.2vw,2.6rem);font-weight:800;text-align:center;margin:6px 0 22px;color:var(--ink)}
.prose p{font-size:var(--read);line-height:1.8;margin:0 0 1em}
.family-note{margin:18px 0 0;padding:14px 16px;border-radius:12px;background:var(--surface-2);font-size:calc(var(--read) * .9);line-height:1.6}
.ruta-libro{margin-top:28px;padding:18px 20px;border-radius:14px;border:2px dashed var(--gold);background:var(--surface)}
.ruta-libro h3{font-size:1.25rem;color:var(--navy-ink);margin-bottom:4px}
.ruta-libro h4{font-family:var(--display);font-size:1rem;margin:12px 0 2px;color:var(--accent-ink)}
.ruta-libro ul{margin:0;padding-left:1.2em}.ruta-libro li,.ruta-libro p{margin:3px 0;font-size:1rem}
.more{display:inline-block;margin-top:18px;font-weight:700}
.folio{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-family:var(--display);color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:760px;margin:16px auto;flex-wrap:wrap}
.pager a[aria-disabled="true"]{visibility:hidden}
.pnum{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.92rem}
.pnum select{max-width:min(46vw,260px);border:1.5px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--surface)}
.book-tools{max-width:760px;margin:0 auto 4px;justify-content:center}
@media (max-width:560px){.pager .pnum{order:-1;flex:1 1 100%;justify-content:center}.pager .pnum select{max-width:62vw}}
.cover{text-align:center}
.cover-art{width:min(260px,70%);height:auto;display:block;margin:0 auto 6px}
.eyebrow-ink{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.cover-title{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:800;margin:6px 0 4px;color:var(--navy-ink)}
.cover-title span{color:var(--orange)}
.cover-sub{font-size:1.1rem;color:var(--muted);margin:0}
.cover-cap{font-family:var(--display);font-size:1.25rem;margin:12px 0 0}
.toc{text-align:left;max-width:460px;margin:30px auto 0;border-top:1px solid var(--line);padding-top:16px}
.toc h3{font-size:1.1rem;margin-bottom:6px}
.toc ol{list-style:none;margin:0;padding:0}
.toc li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line)}
.toc a{font-weight:700;text-decoration:none}.toc span{color:var(--muted);flex:none;font-size:.9rem}

/* ===== Libro digital: hojas, vuelta de página, ambientes ===== */
body{background:linear-gradient(160deg,color-mix(in srgb,var(--tema-a,#EAF7E8) 70%,var(--bg)),color-mix(in srgb,var(--tema-b,#FFF4E6) 70%,var(--bg)));background-attachment:fixed;min-height:100vh}
main{background-image:var(--tema-patron);background-size:260px 260px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:linear-gradient(160deg,color-mix(in srgb,var(--tema-a,#EAF7E8) 10%,var(--bg)),color-mix(in srgb,var(--tema-b,#FFF4E6) 8%,var(--bg)))}}
.modo-libro main{padding-block:14px 30px}
.libro{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;max-width:900px;margin:0 auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage{position:relative;flex:1;max-width:780px;perspective:2200px;touch-action:pan-y}
.leaf{position:absolute;inset:0;background:var(--paper);border-radius:4px 18px 18px 4px;border:1px solid var(--line);box-shadow:inset 18px 0 22px -16px rgba(26,45,122,.28),6px 8px 0 -3px var(--paper),6px 8px 0 -2px var(--line),12px 16px 30px -18px rgba(26,45,122,.5);overflow:hidden;transform-origin:left center;backface-visibility:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.leaf.medir{position:absolute;left:-10000px;top:0;visibility:hidden;inset:auto}
.leaf-in{position:absolute;inset:0;padding:clamp(22px,4vw,40px) clamp(20px,5vw,52px) 44px clamp(26px,5.5vw,58px);overflow:hidden;z-index:1}
.leaf-in.scroll{overflow:auto;-webkit-overflow-scrolling:touch}
